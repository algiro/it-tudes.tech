        # >>> it-tudes-site (company website; installed by it-tudes.tech/tools/setup-server.sh)
        # Static site from $REMOTE_BASE/current (see tools/deploy.local.env), mounted at
        # /srv/it-tudes. Every other app on this proxy keeps its own, more specific location,
        # so this block only answers paths nothing else claims. Never add site pages under
        # a path another app owns.
        location / {
            root /srv/it-tudes/current;
            index index.html;
            try_files $uri $uri/index.html $uri/ =404;
            error_page 404 /404.html;
        }
        location ^~ /_astro/ {
            root /srv/it-tudes/current;
            # File names carry a content hash, so they can be cached for good.
            # "expires" (not add_header) keeps the server-wide security headers.
            expires 1y;
        }
        # <<< it-tudes-site
